name: Auto Check Gitee & Deploy

on:
  # 监听阿里云 FC 转发过来的 Gitee Push 事件
  repository_dispatch:
    types: [gitee_push]
  # 保留页面手动点击按钮触发
  workflow_dispatch:

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deploy Script
        uses: actions/checkout@v3

      # 1. 配置 SSH 私钥以拉取 Gitee 代码
      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.GITEE_SSH_KEY }}

      # 2. 校验并获取 Gitee 最新提交信息
      - name: Fetch Gitee Beta Info
        id: check_gitee
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

          git remote add gitee "git@gitee.com:ujuz/erp.web.portal.git"

          if ! git fetch gitee beta --depth=1; then
            echo "::error::git fetch 失败！请检查 GITEE_SSH_KEY 公钥配置。"
            exit 1
          fi

          COMMIT_MSG=$(git log -1 --format="%s" gitee/beta)
          SAFE_MSG=$(echo "$COMMIT_MSG" | head -n 1 | tr -d '"\r\n')
          
          echo "码云最新 Commit 备注: $SAFE_MSG"
          echo "commit_msg=$SAFE_MSG" >> $GITHUB_OUTPUT

      # 3. 环境准备
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 4. 执行部署
      - name: Run Deploy Script
        env:
          DEPLOY_USERNAME: liucong
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_BASE_URL: https://avatar-beta.yjzf.com
          APP_NAME: 'erp.web.portal'
          NOTE: "${{ steps.check_gitee.outputs.commit_msg }}"
        run: |
          echo "收到 Gitee 实时变动通知，开始执行部署脚本..."
          echo "本次构建备注: $NOTE"
          node yjcd-deploy.js --app "$APP_NAME" --yes --allow-live --note "$NOTE"
name: Auto Check Gitee & Deploy

on:
  schedule:
    # 每 5 分钟检查一次码云 beta 分支变动
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击按钮触发部署

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deploy Script
        uses: actions/checkout@v3

      - name: Check Gitee Beta Commit
        id: check_gitee
        run: |
          # 1. 拼接 用户名:Token 强认证地址，访问 ujuz 企业的 erp.web.portal 仓库
          GITEE_REPO_URL="https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/ujuz/erp.web.portal.git"

          git remote add gitee "$GITEE_REPO_URL"

          # 2. 拉取 gitee beta 分支最近 1 条提交元数据
          if ! git fetch gitee beta --depth=1; then
            echo "::error::git fetch 失败！请确认 GITEE_USERNAME (${{ secrets.GITEE_USERNAME }}) 是否具备 ujuz/erp.web.portal 仓库的访问权限。"
            exit 1
          fi

          # 3. 解析 Commit SHA 和 提交备注信息 (Commit Message)
          LATEST_SHA=$(git rev-parse gitee/beta)
          COMMIT_MSG=$(git log -1 --format="%s" gitee/beta)

          echo "码云最新 Commit SHA: $LATEST_SHA"
          echo "码云最新 Commit 备注: $COMMIT_MSG"

          # 4. 读取上一次部署记录的 SHA
          if [ -f .last_gitee_sha ]; then
            LAST_SHA=$(cat .last_gitee_sha)
          else
            LAST_SHA=""
          fi

          # 5. 判断是否有新代码提交或手动触发
          if [ "$LATEST_SHA" != "$LAST_SHA" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "need_deploy=true" >> $GITHUB_OUTPUT
            # 过滤换行符与双引号
            SAFE_MSG=$(echo "$COMMIT_MSG" | head -n 1 | tr -d '"\r\n')
            echo "commit_msg=$SAFE_MSG" >> $GITHUB_OUTPUT
            echo "$LATEST_SHA" > .last_gitee_sha
          else
            echo "码云 beta 分支无新代码，跳过本次部署。"
            echo "need_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.check_gitee.outputs.need_deploy == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Deploy Script
        if: steps.check_gitee.outputs.need_deploy == 'true'
        env:
          DEPLOY_USERNAME: liucong
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_BASE_URL: https://avatar-beta.yjzf.com
          APP_NAME: 'erp.web.portal'
          NOTE: "auto-deploy: ${{ steps.check_gitee.outputs.commit_msg }}"
        run: |
          echo "检测到代码变动，开始执行部署脚本..."
          echo "本次构建备注: $NOTE"
          node yjcd-deploy.js --app "$APP_NAME" --yes --allow-live --note "$NOTE"